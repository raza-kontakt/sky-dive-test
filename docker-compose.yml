version: '3.8'

services:
  app:
    build: .
    container_name: dfv-trainer
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    restart: unless-stopped
    networks:
      - dfv-net

networks:
  dfv-net:
    driver: bridge
